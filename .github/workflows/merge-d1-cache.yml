# One-off: merges #10 once the D1 daily read limit resets, runs CI to apply its migration and deploy, then deletes itself.
name: Merge D1 cache after quota reset

on:
  schedule:
    - cron: "30 0 5 11 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELF: .github/workflows/merge-d1-cache.yml
    steps:
      - name: Merge #10
        run: |
          if [ "$(gh pr view 10 -R "$REPO" --json state -q .state)" = OPEN ]; then
            gh pr merge 10 -R "$REPO" --squash --delete-branch
          fi
      # A merge made with GITHUB_TOKEN does not trigger the push workflow, so CI is dispatched explicitly.
      - name: Apply migrations and deploy
        run: gh workflow run ci.yml -R "$REPO" --ref main
      - name: Remove this workflow
        run: |
          sha=$(gh api "repos/$REPO/contents/$SELF" -q .sha)
          gh api -X DELETE "repos/$REPO/contents/$SELF" -f message="ci: remove the one-off D1 cache merge" -f sha="$sha"
